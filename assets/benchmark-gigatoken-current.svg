<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Current batch-32 throughput against Gigatoken 0.10.0</title>
  <desc id="desc">On an Apple M2, Snaptokens reaches 2.266, 2.172, 1.830, 2.244, 2.247, and 1.619 times Gigatoken throughput across GPT-2, Qwen 3, DeepSeek R1, GPT-OSS, Phi-4 mini, and Gemma 3.</desc>
  <rect width="900" height="520" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Batch-32 throughput vs Gigatoken 0.10.0</text>
  <text x="450" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#59636e">Apple M2 · 4 Rayon workers · 140-byte inputs · matched flat-ragged APIs</text>

  <g font-family="system-ui, sans-serif" font-size="11" fill="#1f2328">
    <rect x="335" y="72" width="13" height="13" rx="2" fill="#2f6feb"/>
    <text x="355" y="83">ByteLevel</text>
    <rect x="455" y="72" width="13" height="13" rx="2" fill="#8250df"/>
    <text x="475" y="83">Byte fallback</text>
  </g>

  <g stroke="#d8dee4" stroke-width="1">
    <line x1="90" y1="400" x2="860" y2="400"/>
    <line x1="90" y1="344" x2="860" y2="344"/>
    <line x1="90" y1="288" x2="860" y2="288"/>
    <line x1="90" y1="232" x2="860" y2="232"/>
    <line x1="90" y1="176" x2="860" y2="176"/>
    <line x1="90" y1="120" x2="860" y2="120"/>
  </g>

  <line x1="90" y1="288" x2="860" y2="288" stroke="#bf8700" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="850" y="280" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#9a6700">1.0×</text>

  <g font-family="system-ui, sans-serif" font-size="10" fill="#59636e" text-anchor="end">
    <text x="80" y="404">0.0×</text>
    <text x="80" y="348">0.5×</text>
    <text x="80" y="292">1.0×</text>
    <text x="80" y="236">1.5×</text>
    <text x="80" y="180">2.0×</text>
    <text x="80" y="124">2.5×</text>
  </g>

  <g>
    <rect x="110" y="146.21" width="80" height="253.79" rx="4" fill="#2f6feb"/>
    <rect x="230" y="156.74" width="80" height="243.26" rx="4" fill="#2f6feb"/>
    <rect x="350" y="195.04" width="80" height="204.96" rx="4" fill="#2f6feb"/>
    <rect x="470" y="148.67" width="80" height="251.33" rx="4" fill="#2f6feb"/>
    <rect x="590" y="148.34" width="80" height="251.66" rx="4" fill="#2f6feb"/>
    <rect x="710" y="218.67" width="80" height="181.33" rx="4" fill="#8250df"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">
    <text x="150" y="138">2.266×</text>
    <text x="270" y="149">2.172×</text>
    <text x="390" y="187">1.830×</text>
    <text x="510" y="141">2.244×</text>
    <text x="630" y="141">2.247×</text>
    <text x="750" y="211">1.619×</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle">
    <text x="150" y="420">GPT-2</text>
    <text x="270" y="420">Qwen 3</text>
    <text x="390" y="420">DeepSeek R1</text>
    <text x="510" y="420">GPT-OSS</text>
    <text x="630" y="420">Phi-4 mini</text>
    <text x="750" y="420">Gemma 3 fallback</text>
  </g>

  <text x="22" y="260" transform="rotate(-90 22 260)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1f2328">Snaptokens / Gigatoken throughput</text>
  <text x="450" y="497" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#59636e">8 no-prewarm rounds/model; Gemma combines two final runs · complete IDs and row lengths matched</text>
</svg>

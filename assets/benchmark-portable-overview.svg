<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img">
<title>Snaptokens throughput advantage across 13 hosts</title>
<desc>Geomean of paired medians; whiskers are the range of per-host geomeans. Higher is better.</desc>

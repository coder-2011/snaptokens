[workspace]
members = [".", "python"]
# benches is standalone like fuzz: a workspace member would be resolved by
# cargo metadata inside Python sdists, which do not ship the benches sources.
exclude = ["fuzz", "benches"]
resolver = "3"

[package]
name = "snaptokens"
version = "0.2.7"
edition = "2024"
rust-version = "1.91"
description = "Fast BPE tokenization from local Hugging Face tokenizer.json files"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/coder-2011/snaptokens"
homepage = "https://github.com/coder-2011/snaptokens"
documentation = "https://docs.rs/snaptokens"
keywords = ["bpe", "llm", "tokenizer"]
categories = ["text-processing"]
include = ["/src/**", "!/src/**/tests.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES"]
# The benches/ directory belongs to the snaptokens-benches member crate, not
# to this package, so target auto-discovery must not claim its sources.
autobenches = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
bincode = "=2.0.1"
blake3 = "1.8.5"
daachorse = "1.0.0"
dary_heap = "0.3.8"
fancy-regex = "0.17.0"
icu_properties = "2"
memchr = "2"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[features]
default = ["huge-pages"]
# Enable transparent huge pages for cache allocations (Linux only).
# When enabled, calls madvise(MADV_HUGEPAGE) to hint the kernel to back
# cache memory with 2MB huge pages, reducing TLB misses. No-op on other platforms.
huge-pages = ["libc"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
anyhow = "1"
hf-hub = { version = "0.4.3", default-features = false, features = ["rustls-tls", "ureq"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

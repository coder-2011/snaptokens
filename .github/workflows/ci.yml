name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check benchmark backend declarations
        run: |
          rustfmt --edition 2024 --check benchmarks/harness/src/backends.rs benchmarks/harness/src/main.rs
          rustc --edition=2024 --test -D warnings benchmarks/harness/src/backends.rs -o "$RUNNER_TEMP/backend-tests"
          "$RUNNER_TEMP/backend-tests"

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Rust documentation
        run: cargo doc --no-deps

      - name: Run tests
        run: |
          # CLI benchmarks need input paths, so compile them without executing them as tests.
          cargo test --all-targets --no-run
          cargo test

  benchmark-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/benchmarks/harness/iree-toolchain.cmake
      SNAPTOKENS_BUILD_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      # The pinned Gigatoken manifest uses Cargo's unstable profile-rustflags feature.
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build clang libclang-dev libc++-dev python3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/harness -> target

      # Build and link the real backend payloads, including the pinned IREE native library.
      - name: Build benchmark harness
        run: cargo -Z profile-rustflags build --locked --manifest-path benchmarks/harness/Cargo.toml --bins

  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            transformers: "4.57.6"
          - python: "3.12"
            transformers: "5.16.1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --manifest-path python/Cargo.toml --out dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest==8.4.2 transformers==${{ matrix.transformers }} dist/*.whl

      - name: Run Python package tests
        run: .venv/bin/python -m pytest -q python/tests
